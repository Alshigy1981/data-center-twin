version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dc-twin-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    environment:
      - DB_PATH=/data/data_center.db
      - SIMULATION_INTERVAL=30
      - CARBON_INTENSITY_KG_PER_KWH=0.233
      - APP_VERSION=1.0.0
      - LOG_LEVEL=INFO
    env_file:
      - .env
    networks:
      - dc_twin_net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dc-twin-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    networks:
      - dc_twin_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local

networks:
  dc_twin_net:
    driver: bridge
